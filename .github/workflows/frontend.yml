name: Frontend

on:
  push:
    branches: [master]
    paths: ["client/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.FRONTEND_BUCKET != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload other static files
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=3600"

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate index.html
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html"

      - name: Remove old assets
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S)
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix assets/ \
            --query "Contents[?LastModified<'$cutoff'].Key" --output text \
            | tr '\t' '\n' | while read -r key; do
              if [ -n "$key" ] && [ "$key" != None ] && [ ! -e "dist/$key" ]; then
                aws s3 rm "s3://$BUCKET/$key"
              fi
            done
